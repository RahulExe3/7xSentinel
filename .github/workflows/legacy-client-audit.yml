name: Legacy Android Client Readiness Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "src/Androrat/**"
      - "src/InOut/**"
      - ".github/workflows/legacy-client-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Inspect legacy client build inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate manifest and required project files
        shell: bash
        run: |
          set -euo pipefail

          test -f src/Androrat/AndroidManifest.xml
          test -f src/Androrat/project.properties
          test -d src/Androrat/src
          test -d src/Androrat/res
          test -d src/InOut

          python3 - <<'PY'
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          project = root / "src/Androrat"
          manifest_path = project / "AndroidManifest.xml"
          ns = {"android": "http://schemas.android.com/apk/res/android"}

          try:
              manifest = ET.parse(manifest_path).getroot()
          except ET.ParseError as exc:
              print(f"::error file={manifest_path}::Invalid XML: {exc}")
              sys.exit(1)

          package_name = manifest.get("package")
          if not package_name:
              print(f"::error file={manifest_path}::Manifest package attribute is missing")
              sys.exit(1)

          print(f"Manifest XML: valid (package={package_name})")

          java_files = list((project / "src").rglob("*.java"))
          java_sources = {}
          for path in java_files:
              text = path.read_text(encoding="utf-8", errors="replace")
              package_match = re.search(r"^\s*package\s+([\w.]+)\s*;", text, re.M)
              class_match = re.search(r"\b(?:class|interface|enum)\s+(\w+)", text)
              if package_match and class_match:
                  java_sources[f"{package_match.group(1)}.{class_match.group(1)}"] = path

          warnings = []
          for tag in ("activity", "activity-alias", "service", "receiver", "provider"):
              for element in manifest.findall(f".//{tag}"):
                  declared = element.get(f"{{{ns['android']}}}name")
                  if not declared:
                      continue
                  if declared.startswith("."):
                      fqcn = package_name + declared
                  elif "." not in declared:
                      fqcn = package_name + "." + declared
                  else:
                      fqcn = declared
                  if fqcn not in java_sources:
                      warnings.append(
                          f"Manifest component {declared!r} has no matching Java class "
                          f"under src/Androrat/src (resolved as {fqcn})"
                      )

          resource_text = "\n".join(
              p.read_text(encoding="utf-8", errors="replace")
              for p in (project / "res").rglob("*")
              if p.is_file() and p.suffix in {".xml", ".txt"}
          )
          for ref in re.findall(r"@(?:string|drawable|layout|xml)/([A-Za-z0-9_]+)", manifest_path.read_text(encoding="utf-8")):
              if not re.search(rf'name=["\\']{re.escape(ref)}["\\']', resource_text):
                  # Drawable resources may be binary files and are verified separately below.
                  drawable_found = any((project / "res").rglob(ref + ".*"))
                  if not drawable_found:
                      warnings.append(f"Manifest resource reference @{ref} was not found in resource XML or files")

          print(f"Java source files discovered: {len(java_files)}")
          print("Shared protocol source directory: present")

          for warning in warnings:
              print(f"::warning file={manifest_path}::{warning}")

          gradle_files = [
              project / "build.gradle",
              project / "build.gradle.kts",
              project / "settings.gradle",
              project / "settings.gradle.kts",
              project / "gradlew",
              project / "build.xml",
          ]
          existing = [str(p) for p in gradle_files if p.exists()]
          if existing:
              print("Build configuration files found: " + ", ".join(existing))
          else:
              print("::notice file=src/Androrat/project.properties::No Gradle wrapper/build files or Ant build.xml found; this legacy Eclipse/ADT project is not yet wired to an APK build job.")

          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Legacy Android client audit\n\n")
              summary.write("- Manifest XML parses successfully.\n")
              summary.write(f"- Package: `{package_name}`.\n")
              summary.write(f"- Java source files found: {len(java_files)}.\n")
              summary.write("- Shared `src/InOut/` source directory is present.\n")
              summary.write("- **This is a source-readiness audit, not an APK build.** No installable APK is produced by this workflow.\n")
              if warnings:
                  summary.write("\n### Items to inspect\n")
                  for warning in warnings:
                      summary.write(f"- {warning}\n")
              if not existing:
                  summary.write("\n### Build-system blocker\n\n")
                  summary.write("The client directory has legacy Eclipse/ADT metadata but no Gradle wrapper/build files or Ant `build.xml`. A modern build configuration has not been established.\n")
          PY
