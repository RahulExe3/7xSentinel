name: 7xConsole Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-console/**"
      - ".github/workflows/7xconsole-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 7xConsole-debug-apk
          path: mobile-console/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
